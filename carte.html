<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carte — Braza-Immobilier</title>
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/carte.css">
  <link rel="stylesheet" href="css/bottom-nav.css">
  <link rel="stylesheet" href="css/responsive.css">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Ajoute ceci -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ed8936">

</head>
<body>

  <header class="header-pro">
    <div class="header-contenu">
      <div class="header-logo">
        <h1 class="site-nom">Braza<span class="separateur">–</span>Immobilier</h1>
        <p class="site-slogan">Trouvez votre logement idéal à Brazzaville</p>
      </div>
      <div class="header-actions">
        <button id="btn-theme" class="btn-theme" title="Changer de thème">🌙</button>
        <a href="index.html" class="btn-publier-pro">
          <span class="btn-icone">←</span>
          <span class="btn-texte">Retour</span>
        </a>
      </div>
    </div>
  </header>

  <main class="carte-page">
    <div class="carte-filtres">
      <div class="recherche-conteneur">
        <input type="text" id="recherche-carte" placeholder="Rechercher une annonce...">
        <button id="btn-recherche" class="btn-recherche" type="button">🔍</button>
      </div>
      
      <select id="filtre-arrondissement-carte">
        <option value="">🏛️ Tous les arrondissements</option>
        <option value="1">1er - Makélékélé</option>
        <option value="2">2e - Bacongo</option>
        <option value="3">3e - Poto-Poto</option>
        <option value="4">4e - Moungali</option>
        <option value="5">5e - Ouenzé</option>
        <option value="6">6e - Talangaï</option>
        <option value="7">7e - Mfilou</option>
        <option value="8">8e - Madibou</option>
        <option value="9">9e - Djiri</option>
        <option value="10">10e - Kintélé</option>
      </select>

      <select id="filtre-quartier-carte">
        <option value="">🏘️ Tous les quartiers</option>
      </select>
    </div>
    
    <div id="carte" class="carte-conteneur"></div>
    
    <div id="info-annonces" class="info-annonces">
      <span id="nombre-annonces">0</span> annonces affichées
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="bottom-nav-item">
      <span class="bottom-nav-icone">🏠</span>
      <span class="bottom-nav-texte">Accueil</span>
    </a>
    <a href="carte.html" class="bottom-nav-item actif">
      <span class="bottom-nav-icone">🗺️</span>
      <span class="bottom-nav-texte">Carte</span>
    </a>
    <a href="mes-annonces.html" class="bottom-nav-item">
      <span class="bottom-nav-icone">📋</span>
      <span class="bottom-nav-texte">Annonces</span>
    </a>
    <a href="favoris.html" class="bottom-nav-item">
      <span class="bottom-nav-icone">❤️</span>
      <span class="bottom-nav-texte">Favoris</span>
    </a>
    <a href="profil.html" class="bottom-nav-item">
      <span class="bottom-nav-icone">👤</span>
      <span class="bottom-nav-texte">Profil</span>
    </a>
    <a href="plus.html" class="bottom-nav-item">
      <span class="bottom-nav-icone">⚙️</span>
      <span class="bottom-nav-texte">Plus</span>
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/carte.js"></script>

	<script>
  // Enregistrement du Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(registration => {
          console.log('SW enregistré avec succès : ', registration.scope);
        })
        .catch(error => {
          console.log('Échec de l\'enregistrement du SW : ', error);
        });
    });
  }
</script>

</body>
</html>
