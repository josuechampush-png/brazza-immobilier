<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historique — Brazza-Immobilier</title>
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/mes-annonces.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/bottom-nav.css">

		<!-- Ajoute ceci -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ed8936">
	
</head>

<body>

  <header class="header-pro">
    <div class="header-contenu">
      <div class="header-logo">
        <h1 class="site-nom">
          Brazza<span class="separateur">–</span>Immobilier
        </h1>
        <p class="site-slogan">Trouvez votre logement idéal à Brazzaville</p>
      </div>
      <div class="header-actions">
        <button id="btn-theme" class="btn-theme" title="Changer de thème">🌙</button>
        <a href="index.html" class="btn-publier-pro">
          <span class="btn-icone">←</span>
          <span class="btn-texte">Retour</span>
        </a>
      </div>
    </div>
  </header>

  <main class="mes-annonces-page">
    
    <div class="page-header">
      <h2 class="page-titre">🕐 Historique</h2>
      <p class="page-description">Annonces récemment consultées</p>
    </div>

    <!-- Bouton effacer tout (caché par défaut) -->
    <div id="zone-actions" style="display:none; text-align:center; margin-bottom:16px;">
      <button id="btn-effacer" class="btn-effacer-historique">🗑️ Effacer tout l'historique</button>
    </div>

    <!-- Skeleton de chargement -->
    <div id="skeleton-historique" class="skeleton-container">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>

    <!-- Liste de l'historique -->
    <div id="liste-historique" class="liste-annonces" style="display:none;"></div>

    <!-- Message si aucun historique -->
    <div id="aucun-historique" style="display:none;">
      <p class="message-info">🕐 Vous n'avez pas encore consulté d'annonce.</p>
      <a href="index.html" class="btn-publier-premiere">🏠 Voir les annonces</a>
    </div>

  </main>
  <nav class="bottom-nav">
    <a href="index.html" class="bottom-nav-item">
      <span class="bottom-nav-icone">🏠</span>
      <span class="bottom-nav-texte">Accueil</span>
    </a>
    <a href="carte.html" class="bottom-nav-item">
      <span class="bottom-nav-icone">🗺️</span>
      <span class="bottom-nav-texte">Carte</span>
    </a>
    <a href="mes-annonces.html" class="bottom-nav-item">
      <span class="bottom-nav-icone">📋</span>
      <span class="bottom-nav-texte">Mes annonces</span>
    </a>
    <a href="favoris.html" class="bottom-nav-item">
      <span class="bottom-nav-icone">❤️</span>
      <span class="bottom-nav-texte">Favoris</span>
    </a>
    <a href="plus.html" class="bottom-nav-item">
      <span class="bottom-nav-icone">⚙️</span>
      <span class="bottom-nav-texte">Plus</span>
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/theme.js"></script>
  <script src="js/historique.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>

	<script>
  // Enregistrement du Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(registration => {
          console.log('SW enregistré avec succès : ', registration.scope);
        })
        .catch(error => {
          console.log('Échec de l\'enregistrement du SW : ', error);
        });
    });
  }
</script>

</body>
</html>
